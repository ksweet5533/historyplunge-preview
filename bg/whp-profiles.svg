<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2=".35"><stop offset="0" stop-color="#123a4a"/><stop offset="0.5" stop-color="#2b5d73"/><stop offset="1" stop-color="#7a6aa8"/></linearGradient>
  <radialGradient id="glow" cx="0.729" cy="0.519" r=".42">
    <stop offset="0" stop-color="#fff1d6" stop-opacity=".42"/><stop offset=".5" stop-color="#fff1d6" stop-opacity=".14"/><stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
  </radialGradient>
  <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
